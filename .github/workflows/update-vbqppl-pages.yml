name: Cập nhật dashboard VBQPPL

on:
  push:
    paths:
      - index.html
      - update_vbqppl_from_google_light.py
      - .github/workflows/update-vbqppl-pages.yml
  schedule:
    # 16:30 hằng ngày theo giờ Việt Nam (UTC+7) = 09:30 UTC.
    - cron: "30 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vbqppl-dashboard-update
  cancel-in-progress: false

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rà soát nguồn Google Docs và cập nhật dashboard
        shell: bash
        run: |
          set -euo pipefail
          python update_vbqppl_from_google_light.py --index index.html --allow-source-failure

      - name: Bổ sung nhãn nguồn Google Docs gốc
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('index.html')
          source = path.read_text(encoding='utf-8')
          doc_url = 'https://docs.google.com/document/d/1lM3yY0Z8IQYFF9IN7YyKvqvb4MvNkSfKCNJPN_H-a6o/edit?usp=sharing'
          source_label = 'Nguồn: Google Docs nguồn chính; cập nhật tự động hằng ngày lúc 16h30'

          if '.source-strip' not in source:
              source = source.replace(
                  '    main.wrap { padding-top: 18px; }',
                  '    main.wrap { padding-top: 18px; }\n'
                  '    .source-strip { padding-top: 10px; padding-bottom: 0; }\n'
                  '    .source-link { display: inline-flex; align-items: center; gap: 6px; border: 1px solid #bfdbfe; background: #eff6ff; color: var(--blue); border-radius: 999px; padding: 8px 12px; font-size: 12px; font-weight: 700; text-decoration: none; }\n'
                  '    .source-link:hover { background: #dbeafe; }'
              )

          if '.pill-link' not in source:
              source = source.replace(
                  '    .pill { border: 1px solid var(--line); background: #fff; color: #344054; border-radius: 999px; padding: 7px 10px; font-size: 12px; white-space: nowrap; }',
                  '    .pill { border: 1px solid var(--line); background: #fff; color: #344054; border-radius: 999px; padding: 7px 10px; font-size: 12px; white-space: nowrap; }\n'
                  '    .pill-link { text-decoration: none; cursor: pointer; }\n'
                  '    .pill-link:hover { border-color: #bfdbfe; background: #eff6ff; color: var(--blue); }'
              )

          header_anchor = f'<a id="headerSourceDocLink" class="pill pill-link" href="{doc_url}" target="_blank" rel="noopener" title="Mở nguồn Google Docs chính">{source_label}</a>'
          source = re.sub(
              r'<(?:span|a)\b[^>]*>Nguồn: Google Docs nguồn chính; cập nhật tự động hằng ngày lúc 16h30</(?:span|a)>',
              header_anchor,
              source,
              count=1,
          )

          if 'id="sourceDocLink"' not in source:
              source = source.replace(
                  '  </header>\n  <main class="wrap">',
                  '  </header>\n'
                  '  <div class="wrap source-strip">\n'
                  f'    <a id="sourceDocLink" class="source-link" href="{doc_url}" target="_blank" rel="noopener">Xem nguồn Google Docs gốc</a>\n'
                  '  </div>\n'
                  '  <main class="wrap">'
              )

          path.write_text(source, encoding='utf-8')
          PY

      - name: Kiểm tra dashboard sau cập nhật
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          grep -q "Dashboard theo dõi xử lý danh mục văn bản QPPL" index.html
          grep -q 'id="dataset"' index.html
          grep -q 'id="completedDataset"' index.html
          grep -q 'id="updatesDataset"' index.html
          grep -q 'id="sourceDocLink"' index.html
          grep -q 'id="headerSourceDocLink"' index.html
          grep -q "Tóm tắt tiến độ xử lý" index.html
          grep -q "Cập nhật tiến độ mới nhất" index.html
          echo "Dashboard VBQPPL đang sẵn sàng."

      - name: Commit và đẩy lên GitHub nếu có số liệu mới
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Không có thay đổi số liệu để đẩy lên GitHub."
          else
            git commit -m "Tự động cập nhật dashboard VBQPPL từ Google Docs"
            git push
          fi
