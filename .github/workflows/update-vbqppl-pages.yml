name: Cập nhật dashboard VBQPPL

on:
  push:
    paths:
      - index.html
      - update_vbqppl_from_google_light.py
      - .github/workflows/update-vbqppl-pages.yml
  schedule:
    # 16:30 hằng ngày theo giờ Việt Nam (UTC+7) = 09:30 UTC.
    - cron: "30 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vbqppl-dashboard-update
  cancel-in-progress: false

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rà soát nguồn Google Docs và cập nhật dashboard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import zipfile
          from collections import Counter
          from io import BytesIO
          from pathlib import Path
          from xml.etree import ElementTree as ET
          import update_vbqppl_from_google_light as m

          def parse_docx_rows(data: bytes) -> dict[str, dict]:
              ns = {"w": "http://schemas.openxmlformats.org/wordprocessingml/2006/main"}
              with zipfile.ZipFile(BytesIO(data)) as zf:
                  xml = zf.read("word/document.xml")
              root = ET.fromstring(xml)
              rows: dict[str, dict] = {}
              current_field = ""
              for table in root.findall(".//w:tbl", ns):
                  for row in table.findall("./w:tr", ns):
                      cells = [m.cell_text(cell, ns) for cell in row.findall("./w:tc", ns)]
                      cells = [c for c in cells if c]
                      if len(cells) >= 2 and re.match(r"^[IVXLCDM]+$", cells[0], re.I):
                          current_field = re.sub(r"\s*\(.*$", "", cells[1]).replace("Lĩnh vực", "").strip() or current_field
                          continue
                      if len(cells) < 2:
                          continue
                      name_index = next((i for i, text in enumerate(cells) if re.search(r"(Nghị quyết|Quyết định|Chỉ thị).{0,180}(NQ[- ]?HĐND|NQ[- ]?HDND|NQHĐND|QĐ-UBND|CT-UBND)", text, re.I)), -1)
                      if name_index < 0:
                          continue
                      name = cells[name_index]
                      base_key = m.norm(name)
                      key = base_key
                      duplicate_index = 2
                      while key in rows:
                          key = f"{base_key} ##{duplicate_index}"
                          duplicate_index += 1
                      following = cells[name_index + 1 :]
                      rows[key] = {
                          "name": name,
                          "matchKey": base_key,
                          "field": current_field,
                          "action": following[0] if len(following) > 0 else "",
                          "proposedTime": following[1] if len(following) > 1 else "",
                          "deadline": following[2] if len(following) > 2 else "",
                          "status": following[3] if len(following) > 3 else "",
                          "note": following[4] if len(following) > 4 else "",
                      }
              return rows

          def phase_from(status: str, note: str = "") -> str:
              s = m.norm(f"{status} {note}")
              if not s or "chưa triển khai" in s or s.startswith("chưa"):
                  return "Chưa triển khai"
              if "đã xử lý" in s or "đã hoàn thành xử lý" in s or "được bãi bỏ bởi" in s or "được bãi bỏ tại" in s or "thay thế bằng" in s:
                  return "Đã hoàn thành"
              if "trình" in s or "thẩm định" in s or "bctđ" in s or "xin ý kiến thành viên" in s:
                  return "Đã trình/thẩm định"
              if "lấy ý kiến" in s or "đang" in s or "đăng ký" in s or "soạn thảo" in s or "quy định chi tiết" in s or "công văn" in s or "phân công" in s:
                  return "Đang thực hiện"
              return "Đang thực hiện"

          def find_source(row: dict, source_rows: dict[str, dict], used_source_keys: set[str] | None = None):
              used_source_keys = used_source_keys or set()
              key = m.norm(row.get("name", ""))
              if key in source_rows and key not in used_source_keys:
                  return key, source_rows[key]
              return next(((source_key, value) for source_key, value in source_rows.items() if source_key not in used_source_keys and key and (value.get("matchKey") == key or key in value.get("matchKey", source_key) or value.get("matchKey", source_key) in key)), None)

          def update_rows(rows: list[dict], done: list[dict], updates: list[dict], source_rows: dict[str, dict], as_of: str):
              existing_events = {m.event_key(event) for event in updates}
              done_names = {m.norm(row.get("name", "")) for row in done}
              active: list[dict] = []
              unmatched = 0
              used_source_keys: set[str] = set()

              for row in rows:
                  found = find_source(row, source_rows, used_source_keys)
                  if not found:
                      unmatched += 1
                      old = {k: row.get(k, "") for k in ("status", "phase", "priority")}
                      item = dict(row)
                      item.update({"completed": True, "completedAt": as_of, "updatedAt": as_of, "recentUpdate": True, "phase": "Đã hoàn thành", "priority": "Hoàn thành", "status": m.FALSE_AUTO_PROGRESS})
                      item_key = m.norm(item.get("name", ""))
                      if item_key not in done_names:
                          done.append(item)
                          done_names.add(item_key)
                      event = {"stt": row.get("stt", ""), "name": row.get("name", ""), "field": row.get("field", ""), "agency": row.get("agency", ""), "updatedAt": as_of, "oldPhase": old.get("phase", ""), "newPhase": "Đã hoàn thành", "oldPriority": old.get("priority", ""), "newPriority": "Hoàn thành", "progress": m.FALSE_AUTO_PROGRESS, "highlight": True, "changes": [{"label": "Tình trạng", "old": old.get("status", ""), "new": m.FALSE_AUTO_PROGRESS}]}
                      if m.event_key(event) not in existing_events:
                          updates.append(event)
                          existing_events.add(m.event_key(event))
                      continue

                  source_key, src = found
                  used_source_keys.add(source_key)
                  old = {k: row.get(k, "") for k in ("action", "proposedTime", "deadline", "status", "note", "phase", "priority")}
                  for key in ("action", "proposedTime", "deadline", "status", "note"):
                      if src.get(key):
                          row[key] = src[key]
                  if src.get("field"):
                      row["field"] = src["field"]
                  row["deadlineMonth"] = m.month_from(row.get("deadline", "")) or row.get("deadlineMonth")
                  row["phase"] = phase_from(row.get("status", ""), row.get("note", ""))
                  row["priority"] = m.priority_from(row)

                  if row["phase"] == "Đã hoàn thành":
                      item = dict(row)
                      item.update({"completed": True, "completedAt": as_of, "updatedAt": as_of, "recentUpdate": True})
                      item_key = m.norm(item.get("name", ""))
                      if item_key not in done_names:
                          done.append(item)
                          done_names.add(item_key)
                      event = m.completion_event(item, old, as_of)
                      if m.event_key(event) not in existing_events:
                          updates.append(event)
                          existing_events.add(m.event_key(event))
                      continue

                  changes = []
                  labels = {"action": "Hình thức xử lý", "proposedTime": "Thời gian sở/ngành đề xuất", "deadline": "Thời hạn UBND", "status": "Tình trạng", "note": "Ghi chú"}
                  for key, label in labels.items():
                      if m.clean(old.get(key, "")) != m.clean(row.get(key, "")):
                          changes.append({"label": label, "old": old.get(key, ""), "new": row.get(key, "")})
                  if changes:
                      row["recentUpdate"] = True
                      row["updatedAt"] = as_of
                      event = {"stt": row.get("stt", ""), "name": row.get("name", ""), "field": row.get("field", ""), "agency": row.get("agency", ""), "updatedAt": as_of, "oldPhase": old.get("phase", ""), "newPhase": row.get("phase", ""), "oldPriority": old.get("priority", ""), "newPriority": row.get("priority", ""), "progress": row.get("status", ""), "changes": changes}
                      if m.event_key(event) not in existing_events:
                          updates.append(event)
                          existing_events.add(m.event_key(event))
                  active.append(row)

              template_by_field = {}
              for row in rows + done:
                  if row.get("field") and row.get("agency"):
                      template_by_field.setdefault(row["field"], row)

              for source_key, src in source_rows.items():
                  if source_key in used_source_keys:
                      continue
                  field = src.get("field") or "Khác"
                  template = template_by_field.get(field, {})
                  name = src.get("name", "")
                  row = {"stt": len(active) + 1, "name": name, "type": "Nghị quyết" if re.search(r"Nghị quyết", name, re.I) else ("Chỉ thị" if re.search(r"Chỉ thị", name, re.I) else "Quyết định"), "province": "Phú Yên" if "Phú Yên" in name else "Đắk Lắk", "agency": template.get("agency") or ("Các ban của HĐND tỉnh" if "HĐND" in name else "UBND tỉnh"), "agencies": template.get("agencies") or ([template.get("agency")] if template.get("agency") else ["Các ban của HĐND tỉnh" if "HĐND" in name else "UBND tỉnh"]), "field": field, "action": src.get("action", ""), "proposedTime": src.get("proposedTime", ""), "deadline": src.get("deadline", ""), "deadlineMonth": m.month_from(src.get("deadline", "")), "status": src.get("status", ""), "note": src.get("note", ""), "completed": False, "recentUpdate": True, "updatedAt": as_of}
                  row["phase"] = phase_from(row.get("status", ""), row.get("note", ""))
                  row["priority"] = m.priority_from(row)
                  active.append(row)
                  event = {"stt": row.get("stt", ""), "name": row.get("name", ""), "field": row.get("field", ""), "agency": row.get("agency", ""), "updatedAt": as_of, "oldPhase": "", "newPhase": row.get("phase", ""), "oldPriority": "", "newPriority": row.get("priority", ""), "progress": row.get("status", "") or "Được bổ sung từ nguồn Google Docs chính", "changes": [{"label": "Bổ sung từ nguồn chính", "old": "", "new": "Có trong Google Docs nguồn chính"}]}
                  if m.event_key(event) not in existing_events:
                      updates.append(event)
                      existing_events.add(m.event_key(event))

              for index, row in enumerate(active, start=1):
                  row["stt"] = index
              return active, done, updates, unmatched

          def refresh_text(source: str, rows: list[dict], done: list[dict], as_of: str) -> str:
              remaining = len(rows)
              processed = m.TOTAL - remaining
              processed_pct = processed / m.TOTAL * 100
              remaining_pct = remaining / m.TOTAL * 100
              counts = Counter(row.get("type", "") for row in rows)
              phases = Counter(row.get("phase", "") for row in rows)
              not_started = phases.get("Chưa triển khai", 0)
              deployed = remaining - not_started
              source = re.sub(r"Đang theo dõi: \d+ văn bản", f"Đang theo dõi: {remaining} văn bản", source)
              source = re.sub(r"Hoàn thành xử lý: \d+ văn bản", f"Hoàn thành xử lý: {len(done)} văn bản", source)
              source = re.sub(r"\d+ nghị quyết · \d+ quyết định", f"{counts.get('Nghị quyết', 0)} nghị quyết · {counts.get('Quyết định', 0)} quyết định", source, count=1)
              source = re.sub(r"Tóm tắt tiến độ xử lý đến ngày [^<]+", f"Tóm tắt tiến độ xử lý đến ngày {as_of}", source)
              source = re.sub(r"Đến ngày <strong>[^<]+</strong>", f"Đến ngày <strong>{as_of}</strong>", source)
              source = re.sub(r"tỉnh còn <strong>\d+ văn bản</strong>", f"tỉnh còn <strong>{remaining} văn bản</strong>", source)
              source = re.sub(r"đã xử lý <strong>\d+ văn bản</strong>", f"đã xử lý <strong>{processed} văn bản</strong>", source)
              source = re.sub(r"đạt khoảng <strong>[^<]+</strong>; còn lại <strong>[^<]+</strong>", f"đạt khoảng <strong>{processed_pct:.1f}%</strong>; còn lại <strong>{remaining_pct:.1f}%</strong>", source)
              source = re.sub(r"Dashboard đang ghi nhận <strong>\d+ văn bản</strong> đã có triển khai/cập nhật tiến độ và <strong>\d+ văn bản</strong> chưa triển khai xử lý", f"Dashboard đang ghi nhận <strong>{deployed} văn bản</strong> đã có triển khai/cập nhật tiến độ và <strong>{not_started} văn bản</strong> chưa triển khai xử lý", source)
              source = re.sub(r"<div class=\"summary-stat\"><b>[^<]+</b><span>Đã xử lý \d+/365 văn bản</span></div>", f"<div class=\"summary-stat\"><b>{processed_pct:.1f}%</b><span>Đã xử lý {processed}/{m.TOTAL} văn bản</span></div>", source)
              source = re.sub(r"<div class=\"summary-stat\"><b>[^<]+</b><span>Còn \d+ văn bản chưa hoàn thành</span></div>", f"<div class=\"summary-stat\"><b>{remaining_pct:.1f}%</b><span>Còn {remaining} văn bản chưa hoàn thành</span></div>", source)
              source = re.sub(r"<div class=\"summary-stat\"><b>\d+</b><span>Văn bản đã triển khai xử lý</span></div>", f"<div class=\"summary-stat\"><b>{deployed}</b><span>Văn bản đã triển khai xử lý</span></div>", source)
              source = re.sub(r"<div class=\"summary-stat\"><b>\d+</b><span>Văn bản chưa triển khai xử lý</span></div>", f"<div class=\"summary-stat\"><b>{not_started}</b><span>Văn bản chưa triển khai xử lý</span></div>", source)
              source = re.sub(r"const recentWindowEnd = parseUpdateDate\('[^']+'\);", f"const recentWindowEnd = parseUpdateDate('{as_of}');", source)
              source = re.sub(r"const latestLabel = '[^']+';", f"const latestLabel = '{as_of}';", source)
              return source

          def ensure_source_links(path: Path) -> None:
              source = path.read_text(encoding="utf-8")
              doc_url = "https://docs.google.com/document/d/1lM3yY0Z8IQYFF9IN7YyKvqvb4MvNkSfKCNJPN_H-a6o/edit?usp=sharing"
              source_label = "Nguồn: Google Docs nguồn chính; cập nhật tự động hằng ngày lúc 16h30"
              if ".source-strip" not in source:
                  source = source.replace("    main.wrap { padding-top: 18px; }", "    main.wrap { padding-top: 18px; }\n    .source-strip { padding-top: 10px; padding-bottom: 0; }\n    .source-link { display: inline-flex; align-items: center; gap: 6px; border: 1px solid #bfdbfe; background: #eff6ff; color: var(--blue); border-radius: 999px; padding: 8px 12px; font-size: 12px; font-weight: 700; text-decoration: none; }\n    .source-link:hover { background: #dbeafe; }")
              if ".pill-link" not in source:
                  source = source.replace("    .pill { border: 1px solid var(--line); background: #fff; color: #344054; border-radius: 999px; padding: 7px 10px; font-size: 12px; white-space: nowrap; }", "    .pill { border: 1px solid var(--line); background: #fff; color: #344054; border-radius: 999px; padding: 7px 10px; font-size: 12px; white-space: nowrap; }\n    .pill-link { text-decoration: none; cursor: pointer; }\n    .pill-link:hover { border-color: #bfdbfe; background: #eff6ff; color: var(--blue); }")
              header_anchor = f'<a id="headerSourceDocLink" class="pill pill-link" href="{doc_url}" target="_blank" rel="noopener" title="Mở nguồn Google Docs chính">{source_label}</a>'
              source = re.sub(r'<(?:span|a)\b[^>]*>Nguồn: Google Docs nguồn chính; cập nhật tự động hằng ngày lúc 16h30</(?:span|a)>', header_anchor, source, count=1)
              if 'id="sourceDocLink"' not in source:
                  source = source.replace('  </header>\n  <main class="wrap">', '  </header>\n  <div class="wrap source-strip">\n' + f'    <a id="sourceDocLink" class="source-link" href="{doc_url}" target="_blank" rel="noopener">Xem nguồn Google Docs gốc</a>\n' + '  </div>\n  <main class="wrap">')
              path.write_text(source, encoding="utf-8")

          m.parse_docx_rows = parse_docx_rows
          m.phase_from = phase_from
          m.find_source = find_source
          m.update_rows = update_rows
          m.refresh_text = refresh_text

          index = Path("index.html")
          m.run(index)
          ensure_source_links(index)
          PY

      - name: Kiểm tra dashboard sau cập nhật
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          grep -q "Dashboard theo dõi xử lý danh mục văn bản QPPL" index.html
          grep -q 'id="dataset"' index.html
          grep -q 'id="completedDataset"' index.html
          grep -q 'id="updatesDataset"' index.html
          grep -q 'id="sourceDocLink"' index.html
          grep -q 'id="headerSourceDocLink"' index.html
          grep -q "Đang theo dõi: 180 văn bản" index.html
          grep -q "Hoàn thành xử lý: 71 văn bản" index.html
          grep -q "68 nghị quyết · 112 quyết định" index.html
          grep -q "Đã xử lý 185/365 văn bản" index.html
          grep -q "Còn 180 văn bản chưa hoàn thành" index.html
          grep -q "Tóm tắt tiến độ xử lý" index.html
          grep -q "Cập nhật tiến độ mới nhất" index.html
          echo "Dashboard VBQPPL đang sẵn sàng."

      - name: Commit và đẩy lên GitHub nếu có số liệu mới
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Không có thay đổi số liệu để đẩy lên GitHub."
          else
            git commit -m "Tự động cập nhật dashboard VBQPPL từ Google Docs"
            git push
          fi
