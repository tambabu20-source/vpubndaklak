name: Cập nhật dashboard VBQPPL

on:
  push:
    paths:
      - index.html
      - update_vbqppl_from_google_light.py
      - .github/workflows/update-vbqppl-pages.yml
  schedule:
    # 16:30 hằng ngày theo giờ Việt Nam (UTC+7) = 09:30 UTC.
    - cron: "30 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vbqppl-dashboard-update
  cancel-in-progress: false

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rà soát nguồn Google Docs và cập nhật dashboard
        shell: bash
        run: |
          set -euo pipefail
          cp index.html /tmp/index-before-vbqppl.html
          python update_vbqppl_from_google_light.py --index index.html --allow-source-failure
          python - <<'PY'
          import re
          from pathlib import Path

          def newest_date(source):
              labels = re.findall(r"(?:latestLabel\s*=\s*'|Tóm tắt tiến độ xử lý đến ngày\s+)(\d{1,2}/\d{1,2}/\d{4})", source)
              def key(value):
                  d, m, y = map(int, value.split('/'))
                  return y, m, d
              return max(labels, key=key) if labels else None

          before_path = Path('/tmp/index-before-vbqppl.html')
          index_path = Path('index.html')
          before = before_path.read_text(encoding='utf-8')
          after = index_path.read_text(encoding='utf-8')
          before_date = newest_date(before)
          after_date = newest_date(after)
          if before_date and after_date:
              bd = tuple(map(int, before_date.split('/')[::-1]))
              ad = tuple(map(int, after_date.split('/')[::-1]))
              if ad < bd:
                  index_path.write_text(before, encoding='utf-8')
                  print(f"Nguồn Google Docs cũ hơn dashboard hiện có ({after_date} < {before_date}); giữ nguyên dashboard.")
          PY

      - name: Bổ sung nhãn nguồn Google Docs gốc
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('index.html')
          source = path.read_text(encoding='utf-8')
          doc_url = 'https://docs.google.com/document/d/1lM3yY0Z8IQYFF9IN7YyKvqvb4MvNkSfKCNJPN_H-a6o/edit?usp=sharing'
          source_label = 'Nguồn: Google Docs nguồn chính; cập nhật tự động hằng ngày lúc 16h30'

          if '.source-strip' not in source:
              source = source.replace(
                  '    main.wrap { padding-top: 18px; }',
                  '    main.wrap { padding-top: 18px; }\n'
                  '    .source-strip { padding-top: 10px; padding-bottom: 0; }\n'
                  '    .source-link { display: inline-flex; align-items: center; gap: 6px; border: 1px solid #bfdbfe; background: #eff6ff; color: var(--blue); border-radius: 999px; padding: 8px 12px; font-size: 12px; font-weight: 700; text-decoration: none; }\n'
                  '    .source-link:hover { background: #dbeafe; }'
              )

          if '.pill-link' not in source:
              source = source.replace(
                  '    .pill { border: 1px solid var(--line); background: #fff; color: #344054; border-radius: 999px; padding: 7px 10px; font-size: 12px; white-space: nowrap; }',
                  '    .pill { border: 1px solid var(--line); background: #fff; color: #344054; border-radius: 999px; padding: 7px 10px; font-size: 12px; white-space: nowrap; }\n'
                  '    .pill-link { text-decoration: none; cursor: pointer; }\n'
                  '    .pill-link:hover { border-color: #bfdbfe; background: #eff6ff; color: var(--blue); }'
              )

          header_anchor = f'<a id="headerSourceDocLink" class="pill pill-link" href="{doc_url}" target="_blank" rel="noopener" title="Mở nguồn Google Docs chính">{source_label}</a>'
          source = re.sub(
              r'<(?:span|a)\b[^>]*>Nguồn: Google Docs nguồn chính; cập nhật tự động hằng ngày lúc 16h30</(?:span|a)>',
              header_anchor,
              source,
              count=1,
          )

          if 'id="sourceDocLink"' not in source:
              source = source.replace(
                  '  </header>\n  <main class="wrap">',
                  '  </header>\n'
                  '  <div class="wrap source-strip">\n'
                  f'    <a id="sourceDocLink" class="source-link" href="{doc_url}" target="_blank" rel="noopener">Xem nguồn Google Docs gốc</a>\n'
                  '  </div>\n'
                  '  <main class="wrap">'
              )

          path.write_text(source, encoding='utf-8')
          PY

      - name: Kiểm tra dashboard sau cập nhật
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          source = Path('index.html').read_text(encoding='utf-8')
          required = [
              'Dashboard theo dõi xử lý danh mục văn bản QPPL',
              'id="dataset"',
              'id="completedDataset"',
              'id="updatesDataset"',
              'id="sourceDocLink"',
              'id="headerSourceDocLink"',
              'Tóm tắt tiến độ xử lý',
              'Cập nhật tiến độ mới nhất',
          ]
          missing = [text for text in required if text not in source]
          if missing:
              raise SystemExit('Thiếu thành phần dashboard: ' + ', '.join(missing))
          match = re.search(r'<script id="dataset" type="application/json">(.*?)</script>', source, re.S)
          data = json.loads(match.group(1))
          if not data:
              raise SystemExit('Danh mục văn bản đang trống.')
          print(f"Dashboard VBQPPL đang sẵn sàng với {len(data)} văn bản đang theo dõi.")
          PY

      - name: Commit và đẩy lên GitHub nếu có số liệu mới
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Không có thay đổi số liệu để đẩy lên GitHub."
          else
            git commit -m "Tự động cập nhật dashboard VBQPPL từ Google Docs"
            git push
          fi
